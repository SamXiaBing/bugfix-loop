name: ci

on:
  push:
  pull_request:

jobs:
  prose:
    name: 中文文档检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 跑 check_prose
        run: |
          set -e
          for f in $(find . -name "*.md" -not -path "./en/*" -not -name "README.md" | sort); do
            python tools/check_prose.py "$f"
          done

  smoke:
    name: 脚本冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 跑 smoke_test
        run: python scripts/smoke_test.py
